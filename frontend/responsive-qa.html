<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Responsive QA — Premium Pay Per Call</title><style>body{margin:0;background:#dce7f2;font:14px system-ui}header{padding:12px 18px;background:#071d36;color:white;display:flex;gap:15px;align-items:center}iframe{display:block;border:0;background:white;height:900px;margin:16px auto}output{display:block;padding:12px;background:white;white-space:pre-wrap}select,input{font:inherit;padding:6px}input{width:75px}</style></head><body><header><label>Width <input id="width" type="number" min="320" max="1920"></label><label>Route <select id="route"><option>/</option><option>/about</option><option>/verticals</option><option>/contact</option><option>/privacy-policy</option><option>/terms-and-conditions</option><option>/missing-page</option></select></label><span>Local QA only — excluded from the production entry points</span></header><iframe title="Website under test" id="site"></iframe><output id="result" role="status">Loading…</output><script type="module">
const params=new URLSearchParams(location.search),width=document.querySelector('#width'),route=document.querySelector('#route'),frame=document.querySelector('#site'),result=document.querySelector('#result');
width.value=Math.min(1920,Math.max(320,Number(params.get('width'))||1280));
route.value=[...route.options].some(o=>o.value===params.get('path'))?params.get('path'):'/';
let observer;
function measure(){const doc=frame.contentDocument;if(!doc?.querySelector('h1'))return;const client=doc.documentElement.clientWidth;const overflow=[...doc.querySelectorAll('h1,h2,h3,p,input,select,textarea,.button,.logo')].filter(e=>{const r=e.getBoundingClientRect();return r.width>0&&!e.closest('.honeypot,.call-scene,.contact-person,.intro-art')&&(r.left < -1||r.right>client+1)}).map(e=>({tag:e.tagName,class:e.className,text:e.textContent?.slice(0,60)}));result.textContent=JSON.stringify({ready:true,route:route.value,requested:Number(width.value),actual:frame.contentWindow.innerWidth,client,scroll:doc.documentElement.scrollWidth,heading:doc.querySelector('h1').textContent,overflow,images:[...doc.images].filter(i=>i.complete&&i.naturalWidth===0).map(i=>i.getAttribute('src')),phoneCTAs:[...doc.querySelectorAll('.call-button')].every(a=>a.tagName==='BUTTON'||a.getAttribute('href')==='/contact')},null,2);}
function load(){result.textContent='Loading…';frame.style.width=width.value+'px';frame.src=route.value;}
frame.addEventListener('load',()=>{observer?.disconnect();observer=new MutationObserver(measure);observer.observe(frame.contentDocument.body,{childList:true,subtree:true});frame.contentWindow.addEventListener('resize',measure);measure();});width.addEventListener('change',load);route.addEventListener('change',load);load();
</script></body></html>
